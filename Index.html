<body>
<div class="barra" aria-hidden="true"></div>
<header class="topo">
  <div>
    <h1>Laboratório TRAJE</h1>
    <p>Os métodos da tese aplicados a dados inventados. Muda os dados, as escolhas e as variáveis e vê o que acontece às conclusões.</p>
    <span class="selo">Todos os dados são fictícios</span>
  </div>
  <div class="acoes">
    <button id="bExportar">Exportar</button>
    <button id="bImportar">Importar</button>
    <button id="bRepor">Repor dados originais</button>
  </div>
</header>
<div class="grelha">
  <nav class="nav" id="nav" aria-label="Secções"></nav>
  <main id="main"></main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo"><div class="caixa" id="modalCaixa"></div></div>
<script>
/* ---------- utilitários ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(rnd,keys,probs){let s=probs.reduce((a,b)=>a+b,0),u=rnd()*s;for(let i=0;i<keys.length;i++){u-=probs[i];if(u<=0)return keys[i]}return keys[keys.length-1]}
function normal(rnd){let u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;txt=txt.replace(/^\ufeff/,'').replace(/\r/g,'');
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  const clean=rows.filter(r=>r.some(v=>v.trim()!==''));
  if(!clean.length)return[];
  const h=clean[0].map(s=>s.trim());
  return clean.slice(1).map(r=>{const o={};h.forEach((k,j)=>o[k]=(r[j]??'').trim());return o})}
function toCSV(rows,cols){cols=cols||Object.keys(rows[0]||{});const esc=v=>{v=v==null?'':String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return[cols.join(',')].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(','))).join('\n')}

/* ---------- álgebra: Jacobi para matrizes simétricas ---------- */
function jacobiEigen(A){
  const n=A.length,a=A.map(r=>r.slice()),V=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  for(let sweep=0;sweep<100;sweep++){
    let off=0;for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)off+=a[i][j]*a[i][j];
    if(off<1e-22)break;
    for(let p=0;p<n;p++)for(let q=p+1;q<n;q++){
      if(Math.abs(a[p][q])<1e-300)continue;
      const th=(a[q][q]-a[p][p])/(2*a[p][q]);
      const t=Math.sign(th||1)/(Math.abs(th)+Math.sqrt(th*th+1));
      const c=1/Math.sqrt(t*t+1),s=t*c;
      for(let k=0;k<n;k++){const akp=a[k][p],akq=a[k][q];a[k][p]=c*akp-s*akq;a[k][q]=s*akp+c*akq}
      for(let k=0;k<n;k++){const apk=a[p][k],aqk=a[q][k];a[p][k]=c*apk-s*aqk;a[q][k]=s*apk+c*aqk}
      for(let k=0;k<n;k++){const vkp=V[k][p],vkq=V[k][q];V[k][p]=c*vkp-s*vkq;V[k][q]=s*vkp+c*vkq}
    }}
  const vals=a.map((r,i)=>r[i]);const idx=vals.map((v,i)=>i).sort((x,y)=>vals[y]-vals[x]);
  return{values:idx.map(i=>vals[i]),vectors:idx.map(i=>V.map(r=>r[i]))} /* vectors[k] = k-ésimo vetor próprio */
}

/* ---------- ACM ---------- */
function mca(rows,active,sup,flipRules){
  const n=rows.length,Q=active.length;
  const cats=[];active.forEach(v=>{const lv=[...new Set(rows.map(r=>String(r[v])))].sort();lv.forEach(l=>cats.push({v,l,name:v+'='+l}))});
  const J=cats.length,N=n*Q;
  const Z=rows.map(r=>cats.map(c=>String(r[c.v])===c.l?1:0));
  const colsum=cats.map((_,j)=>Z.reduce((s,z)=>s+z[j],0));
  const c=colsum.map(x=>x/N),rr=1/n;
  const S=Z.map(z=>z.map((x,j)=>(x/N-rr*c[j])/Math.sqrt(rr*c[j])));
  const C=Array.from({length:J},(_,i)=>Array.from({length:J},(_,j)=>{let s=0;for(let k=0;k<n;k++)s+=S[k][i]*S[k][j];return s}));
  const eg=jacobiEigen(C);
  const K=eg.values.filter(v=>v>1e-10).length;
  const lam=eg.values.slice(0,K),sv=lam.map(Math.sqrt);
  const Vk=eg.vectors.slice(0,K);
  const G=cats.map((_,j)=>Vk.map((vec,k)=>vec[j]*sv[k]/Math.sqrt(c[j])));
  const F=S.map(srow=>Vk.map(vec=>{let s=0;for(let j=0;j<J;j++)s+=srow[j]*vec[j];return s/Math.sqrt(rr)}));
  const flip=k=>{G.forEach(g=>g[k]*=-1);F.forEach(f=>f[k]*=-1)};
  (flipRules||[]).forEach(([catName,k])=>{const j=cats.findIndex(x=>x.name===catName);if(j>=0&&k<K&&G[j][k]<0)flip(k)});
  const tot=lam.reduce((a,b)=>a+b,0);
  const benz=lam.map(l=>l>1/Q?Math.pow((Q/(Q-1))*(l-1/Q),2):0),bt=benz.reduce((a,b)=>a+b,0)||1;
  const ctr=cats.map((_,j)=>lam.map((l,k)=>c[j]*G[j][k]*G[j][k]/l*100));
  const cos2=G.map(g=>{const s=g.reduce((a,b)=>a+b*b,0)||1;return g.map(x=>x*x/s)});
  const supOut=[];(sup||[]).forEach(v=>{const lv=[...new Set(rows.map(r=>String(r[v])))].sort();lv.forEach(l=>{
    const idx=rows.map((r,i)=>String(r[v])===l?i:-1).filter(i=>i>=0),nk=idx.length;
    const coord=lam.map((L,k)=>idx.reduce((s,i)=>s+F[i][k],0)/nk/Math.sqrt(L));
    const vt=coord.map(x=>nk<n?x*Math.sqrt(nk*(n-1)/(n-nk)):0);
    supOut.push({v,l,name:v+'='+l,n:nk,coord,vtest:vt})})});
  return{cats,mass:c,lam,rawPct:lam.map(l=>l/tot*100),benzPct:benz.map(b=>b/bt*100),F,G,ctr,cos2,sup:supOut,Q,n,K,J}
}

/* ---------- classificação hierárquica (Lance-Williams) ---------- */
function euclid(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)}
function hclust(D,method){ /* D: matriz de distâncias; devolve merges [a,b,dist,size] estilo scipy */
  const n=D.length;const d=new Map();const key=(i,j)=>i<j?i*100000+j:j*100000+i;
  const sq=method==='ward';
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)d.set(key(i,j),sq?D[i][j]*D[i][j]:D[i][j]);
  const size={};let active=[];for(let i=0;i<n;i++){size[i]=1;active.push(i)}
  const merges=[];let next=n;
  while(active.length>1){
    let best=Infinity,bi=-1,bj=-1;
    for(let x=0;x<active.length;x++)for(let y=x+1;y<active.length;y++){const v=d.get(key(active[x],active[y]));if(v<best-1e-12){best=v;bi=active[x];bj=active[y]}}
    const ni=size[bi],nj=size[bj],nn=next++;
    size[nn]=ni+nj;
    for(const k of active){if(k===bi||k===bj)continue;
      const dik=d.get(key(bi,k)),djk=d.get(key(bj,k)),dij=best,nk=size[k];let v;
      if(method==='ward')v=((ni+nk)*dik+(nj+nk)*djk-nk*dij)/(ni+nj+nk);
      else if(method==='single')v=Math.min(dik,djk);
      else if(method==='complete')v=Math.max(dik,djk);
      else v=(ni*dik+nj*djk)/(ni+nj);
      d.set(key(nn,k),v)}
    merges.push([Math.min(bi,bj),Math.max(bi,bj),sq?Math.sqrt(best):best,ni+nj]);
    active=active.filter(k=>k!==bi&&k!==bj);active.push(nn)}
  return merges}
function cutTree(merges,n,k){ /* etiquetas 0..k-1 */
  const parent={};const find=x=>{while(parent[x]!==undefined&&parent[x]!==x)x=parent[x];return x};
  const upto=merges.length-(k-1);
  for(let i=0;i<upto;i++){const[a,b]=merges[i];parent[a]=n+i;parent[b]=n+i}
  const roots=[],lab=[];for(let i=0;i<n;i++){const r=find(i);let idx=roots.indexOf(r);if(idx<0){roots.push(r);idx=roots.length-1}lab.push(idx)}
  return lab}
function wardPoints(P){const D=P.map(a=>P.map(b=>euclid(a,b)));return hclust(D,'ward')}

/* ---------- Mantel ---------- */
function upper(M,idx){const v=[];for(let i=0;i<idx.length;i++)for(let j=i+1;j<idx.length;j++)v.push(M[idx[i]][idx[j]]);return v}
function pearson(x,y){const n=x.length;const mx=x.reduce((a,b)=>a+b,0)/n,my=y.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){const a=x[i]-mx,b=y[i]-my;sxy+=a*b;sxx+=a*a;syy+=b*b}return sxx&&syy?sxy/Math.sqrt(sxx*syy):0}
function permutations(n){const out=[],a=[...Array(n).keys()];const rec=k=>{if(k===n){out.push(a.slice());return}for(let i=k;i<n;i++){[a[k],a[i]]=[a[i],a[k]];rec(k+1);[a[k],a[i]]=[a[i],a[k]]}};rec(0);return out}
function mantel(A,B,C,opts){
  const n=A.length,id=[...Array(n).keys()];
  const b=upper(B,id),cc=C?upper(C,id):null;
  const stat=a=>{const rab=pearson(a,b);if(!cc)return rab;const rac=pearson(a,cc),rbc=pearson(b,cc);const den=Math.sqrt((1-rac*rac)*(1-rbc*rbc));return den?(rab-rac*rbc)/den:0};
  const obs=stat(upper(A,id));
  let perms,exact=n<=8;
  if(exact)perms=permutations(n);else{const rnd=mulberry32((opts&&opts.seed)||42);perms=[id.slice()];for(let t=0;t<((opts&&opts.nperm)||9999);t++){const p=id.slice();for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]]}perms.push(p)}}
  let cnt=0;for(const p of perms){if(stat(upper(A,p))>=obs-1e-12)cnt++}
  return{r:obs,p:cnt/perms.length,nperm:perms.length,exact}}

/* ---------- redes ---------- */
function brandes(nodes,adj){ /* não ponderado, não orientado, normalizado como networkx */
  const CB={};nodes.forEach(v=>CB[v]=0);
  for(const s of nodes){const Sx=[],P={},sig={},d={};nodes.forEach(v=>{P[v]=[];sig[v]=0;d[v]=-1});sig[s]=1;d[s]=0;const Qu=[s];
    while(Qu.length){const v=Qu.shift();Sx.push(v);for(const w of adj[v]){if(d[w]<0){Qu.push(w);d[w]=d[v]+1}if(d[w]===d[v]+1){sig[w]+=sig[v];P[w].push(v)}}}
    const del={};nodes.forEach(v=>del[v]=0);
    while(Sx.length){const w=Sx.pop();for(const v of P[w])del[v]+=sig[v]/sig[w]*(1+del[w]);if(w!==s)CB[w]+=del[w]}}
  const n=nodes.length,sc=n>2?1/((n-1)*(n-2)):0;nodes.forEach(v=>CB[v]*=sc);return CB}
function louvain(nodes,W){ /* W[a][b]=peso; devolve lista de comunidades */
  let comm={};nodes.forEach((v,i)=>comm[v]=i);

/* ================= gráficos SVG ================= */
function textoLargura(t,px){return String(t).length*px*0.56}
function mapaDispersao(o){ /* o: {pontos:[{x,y,rot,tipo,cor,r}], w,h, eixoX, eixoY, fundo:[{x,y,cor}]} */
  const W=o.w||680,H=o.h||500,m=46;
  const todos=o.pontos.concat(o.fundo||[]);
  let xs=todos.map(p=>p.x),ys=todos.map(p=>p.y);
  let x0=Math.min(0,...xs),x1=Math.max(0,...xs),y0=Math.min(0,...ys),y1=Math.max(0,...ys);
  const px=(x1-x0)*.08||1,py=(y1-y0)*.08||1;x0-=px;x1+=px;y0-=py;y1+=py;
  const sc=Math.min((W-2*m)/(x1-x0),(H-2*m)/(y1-y0));
  const cx=(W-(x1-x0)*sc)/2,cy=(H-(y1-y0)*sc)/2;
  const X=x=>cx+(x-x0)*sc,Y=y=>H-cy-(y-y0)*sc;
  let s=`<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'mapa')}">`;
  s+=`<line x1="${m/2}" y1="${Y(0)}" x2="${W-m/2}" y2="${Y(0)}" style="stroke:var(--rule-strong)" stroke-width="1"/>`;
  s+=`<line x1="${X(0)}" y1="${m/2}" x2="${X(0)}" y2="${H-m/2}" style="stroke:var(--rule-strong)" stroke-width="1"/>`;
  s+=`<text x="${W-m/2}" y="${Y(0)+16}" text-anchor="end" font-size="12" style="fill:var(--muted)">${esc(o.eixoX)}</text>`;
  s+=`<text x="${X(0)+6}" y="${m/2+10}" font-size="12" style="fill:var(--muted)">${esc(o.eixoY)}</text>`;
  (o.fundo||[]).forEach(p=>{s+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.6" style="fill:${p.cor};opacity:.45"/>`});
  const caixas=[];o.pontos.forEach(p=>caixas.push({x:X(p.x)-5,y:Y(p.y)-5,w:10,h:10}));
  const sobre=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  const etiquetas=[];
  o.pontos.forEach((p,i)=>{
    const x=X(p.x),y=Y(p.y);
    if(p.tipo==='tri')s+=`<polygon points="${x},${y-6.5} ${x-6},${y+4.5} ${x+6},${y+4.5}" style="fill:${p.cor}"/>`;
    else s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${p.r||4.5}" style="fill:${p.cor}"/>`;
    const w=textoLargura(p.rot,12),h=13;
    const cand=[[8,4,'start'],[-8,4,'end'],[0,-10,'middle'],[0,17,'middle'],[8,-8,'start'],[8,15,'start'],[-8,-8,'end'],[-8,15,'end'],[14,-18,'start'],[-14,-18,'end'],[14,26,'start'],[-14,26,'end']];
    let escolha=null;
    for(const[dx,dy,an]of cand){const bx=an==='start'?x+dx:an==='end'?x+dx-w:x+dx-w/2;const b={x:bx,y:y+dy-11,w,h};
      if(b.x<2||b.x+b.w>W-2||b.y<2||b.y+b.h>H-2)continue;
      if(caixas.some((c,j)=>j!==i&&j<o.pontos.length&&sobre(b,c)))continue;
      if(etiquetas.some(e=>sobre(b,e)))continue;escolha={dx,dy,an,b};break}
    let fraco=false;if(!escolha){escolha={dx:8,dy:4,an:'start',b:{x:x+8,y:y-7,w,h}};fraco=true}
    etiquetas.push(escolha.b);
    if(Math.abs(escolha.dx)>10||Math.abs(escolha.dy)>18)s+=`<line x1="${x}" y1="${y}" x2="${x+escolha.dx*0.7}" y2="${y+escolha.dy*0.6}" style="stroke:var(--muted)" stroke-width=".6" stroke-dasharray="2 2"/>`;
    s+=`<text x="${(x+escolha.dx).toFixed(1)}" y="${(y+escolha.dy).toFixed(1)}" text-anchor="${escolha.an}" font-size="12" style="fill:${p.corTexto||'var(--ink)'};${fraco?'opacity:.6':''}">${esc(p.rot)}</text>`});
  return s+'</svg>'}
function graficoLinhas(o){ /* {rotulos, series:[{nome,valores,erros}], yTitulo, marcadores:[{i,rot}], h, xNum} */
  const W=680,H=o.h||300,ml=52,mr=18,mt=18,mb=40;
  const all=o.series.flatMap(s=>s.valores.map((v,i)=>v+((s.erros&&s.erros[i])||0))).filter(isFinite);
  const allmin=o.series.flatMap(s=>s.valores.map((v,i)=>v-((s.erros&&s.erros[i])||0))).filter(isFinite);
  let y0=o.yMin!=null?o.yMin:Math.min(0,...allmin),y1=Math.max(...all,y0+1);y1+=(y1-y0)*.08;
  const n=o.rotulos.length;
  const xv=o.xNum||o.rotulos.map((_,i)=>i);const xa=Math.min(...xv),xb=Math.max(...xv);
  const X=v=>ml+((v-xa)/((xb-xa)||1))*(W-ml-mr),Y=v=>H-mb-(v-y0)/(y1-y0)*(H-mt-mb);
  let s=`<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'gráfico de linhas')}">`;
  const ticks=5;for(let t=0;t<=ticks;t++){const v=y0+(y1-y0)*t/ticks,yy=Y(v);s+=`<line x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}" style="stroke:var(--rule)" stroke-width="1"/><text x="${ml-6}" y="${yy+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${Math.abs(y1-y0)<5?v.toFixed(2).replace('.',','):Math.round(v)}</text>`}
  o.rotulos.forEach((r,i)=>{s+=`<text x="${X(xv[i])}" y="${H-mb+18}" text-anchor="middle" font-size="11.5" style="fill:var(--muted)">${esc(r)}</text>`});
  (o.marcadores||[]).forEach(mk=>{const xx=X(mk.x);s+=`<line x1="${xx}" x2="${xx}" y1="${mt}" y2="${H-mb}" style="stroke:var(--garanca)" stroke-dasharray="4 3" stroke-width="1"/><text x="${xx+4}" y="${mt+10}" font-size="11.5" style="fill:var(--garanca)">${esc(mk.rot)}</text>`});
  if(o.yTitulo)s+=`<text x="${ml}" y="${H-6}" font-size="11.5" style="fill:var(--muted)">${esc(o.yTitulo)}</text>`;
  o.series.forEach((se,k)=>{const cor=CORES[k%CORES.length],tr=TRACOS[k%TRACOS.length];
    const pts=se.valores.map((v,i)=>isFinite(v)?`${X(xv[i]).toFixed(1)},${Y(v).toFixed(1)}`:null).filter(Boolean).join(' ');
    s+=`<polyline points="${pts}" fill="none" style="stroke:${cor}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${tr?`stroke-dasharray="${tr}"`:''}/>`;
    se.valores.forEach((v,i)=>{if(!isFinite(v))return;const e=se.erros&&se.erros[i];if(e){s+=`<line x1="${X(xv[i])}" x2="${X(xv[i])}" y1="${Y(v-e)}" y2="${Y(v+e)}" style="stroke:${cor}" stroke-width="1.4"/>`}
      s+=`<circle cx="${X(xv[i]).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.6" style="fill:${cor};stroke:var(--surface2)" stroke-width="1.5"><title>${esc(se.nome)}: ${esc(o.rotulos[i])} = ${v}</title></circle>`})});
  return s+'</svg>'+legenda(o.series.map(s=>s.nome))}
function legenda(nomes){return`<div class="cartoes" style="gap:6px 18px;margin-top:0">${nomes.map((n,k)=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)"><svg width="30" height="10" aria-hidden="true"><line x1="1" y1="5" x2="29" y2="5" style="stroke:${CORES[k%CORES.length]}" stroke-width="2.4" ${TRACOS[k%TRACOS.length]?`stroke-dasharray="${TRACOS[k%TRACOS.length]}"`:''}/></svg>${esc(n)}</span>`).join('')}</div>`}
function barrasH(itens){ /* [{rot,valor,cor}] */
  const max=Math.max(1,...itens.map(i=>i.valor));const W=680,lh=28,H=itens.length*lh+14;
  let s=`<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="barras">`;
  itens.forEach((it,i)=>{const y=8+i*lh,w=(W-230)*it.valor/max;s+=`<text x="12" y="${y+15}" font-size="13" style="fill:var(--ink)">${esc(it.rot)}</text><rect x="150" y="${y+3}" width="${Math.max(1,w)}" height="16" rx="2" style="fill:${it.cor||'var(--anil)'}"/><text x="${156+w}" y="${y+15}" font-size="12.5" style="fill:var(--muted)">${esc(it.txt??it.valor)}</text>`});
  return s+'</svg>'}

/* ================= 1. ficha e ACM ================= */
function gerarTrajes(){
  const g=S.gen,rnd=mulberry32(+g.seed||1),rows=[];
  S.grupos.forEach(gr=>{let p=(g.pesos[gr.periodo]||[1,1,1,1]).map(Number);if(gr.rede==='R3')p[2]+=+g.r3;const n=Math.floor(+g.min+rnd()*((+g.max)-(+g.min)+1));
    for(let t=0;t<n;t++){const reg=pick(rnd,REGIMES,p);const r={grupo:gr.grupo,traje:gr.grupo+'-T'+(t+1),regime_real:reg,zona:gr.zona,fundacao:gr.periodo,provincia:gr.provincia,rede:gr.rede};
      for(const v of Object.keys(DIST[reg])){const src=rnd()<+g.mistura?REGIMES[Math.floor(rnd()*4)]:reg;const d=DIST[src][v];r[v]=pick(rnd,Object.keys(d),Object.values(d))}
      rows.push(r)}});
  S.trajes=rows}
let ACM=null;
function calcularACM(){
  const cols=Object.keys(S.trajes[0]||{}).filter(c=>c!=='grupo'&&c!=='traje');
  cols.forEach(c=>{if(!S.papeis[c])S.papeis[c]='ignorar'});
  const act=cols.filter(c=>S.papeis[c]==='ativa'),sup=cols.filter(c=>S.papeis[c]==='sup'),oc=cols.filter(c=>S.papeis[c]==='oculta');
  if(act.length<2)return{erro:'Escolhe pelo menos duas variáveis ativas.',cols};
  const M=mca(S.trajes,act,sup,[['proveniencia=comprada',0],['fonte=museu_publicacao',1]]);
  if(M.K<1)return{erro:'Os dados não têm variação suficiente para a análise.',cols};
  const dims=Math.min(+S.acm.dims,M.K),k=Math.min(+S.acm.k,M.n-1);
  const P=M.F.map(f=>f.slice(0,dims));const lab=cutTree(wardPoints(P),P.length,k);
  /* perfis */
  const n=M.n,cl=[];for(let c=0;c<k;c++){const idx=lab.map((l,i)=>l===c?i:-1).filter(i=>i>=0);
    const perfil=M.cats.map((ct,j)=>{const cnt=idx.filter(i=>String(S.trajes[i][ct.v])===ct.l).length;const share=cnt/idx.length,glob=M.mass[j]*M.Q;return{name:ct.name,v:ct.v,l:ct.l,share,glob,ratio:glob?share/glob:0}}).sort((a,b)=>b.ratio-a.ratio);
    const supDom={};sup.forEach(v=>{const m={};idx.forEach(i=>{const x=String(S.trajes[i][v]);m[x]=(m[x]||0)+1});const top=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];supDom[v]=top?[top[0],top[1]/idx.length]:null});
    const cen=[0,1].map(d=>d<M.K?idx.reduce((s,i)=>s+M.F[i][d],0)/idx.length:0);
    cl.push({c,n:idx.length,idx,perfil,supDom,cen})}
  cl.forEach(x=>{const t=x.perfil[0]?.name||'';x.sugestao=/museu/.test(t)?'museológico':/(comprada|fornecedor|sintetico|inferido|nenhuma)/.test(t)?'mercado':/(herdada|familia|vago|declarado)/.test(t)?'patrimonial':/(reconstituida|fotografia|preciso|documentado)/.test(t)?'documental':'classe '+(x.c+1)});
  return{M,act,sup,oc,cols,lab,cl,dims,k}}
function render1(){
  const el=sec(1);const R=calcularACM();ACM=R;const a=S.acm,g=S.gen;

function calcularRede(){
  const samp=amostra(),P=S.rede.pessoas.filter(p=>p.ativo&&p.nome.trim());
  const pessoas=P.map(p=>({...p,grupos:p.grupos.filter(g=>samp.includes(g))}));
  const nodes=samp.concat(pessoas.map(p=>'@'+p.nome));const adj={};nodes.forEach(v=>adj[v]=[]);
  pessoas.forEach(p=>p.grupos.forEach(g=>{adj['@'+p.nome].push(g);adj[g].push('@'+p.nome)}));
  const bc=brandes(nodes,adj);
  const W={};samp.forEach(a=>W[a]={});const via={};
  for(let i=0;i<samp.length;i++)for(let j=i+1;j<samp.length;j++){let w=0,v=[];pessoas.forEach(p=>{if(p.grupos.includes(samp[i])&&p.grupos.includes(samp[j])){w+=+(S.rede.pesos[p.tipo]??1);v.push(p.nome)}});if(w>0){W[samp[i]][samp[j]]=w;W[samp[j]][samp[i]]=w;via[samp[i]+'|'+samp[j]]=v}}
  const comms=samp.length?louvain(samp,W):[];
  const E={};samp.forEach(a=>{E[a]={};Object.entries(W[a]).forEach(([b,w])=>E[a][b]=1/w)});
  const D=samp.map(a=>{const d=dijkstra(samp,E,a);return samp.map(b=>d[b])});
  const desligada=D.some(r=>r.some(x=>!isFinite(x)));
  let maxF=0;D.forEach(r=>r.forEach(x=>{if(isFinite(x))maxF=Math.max(maxF,x)}));
  const Dfix=D.map(r=>r.map(x=>isFinite(x)?x:maxF+1));
  return{samp,pessoas,nodes,adj,bc,W,via,comms,D,Dfix,desligada}}
function comunidadeDe(R,g){return R.comms.findIndex(c=>c.includes(g))}

const MVARS=[['saia_altura','saia/altura'],['bainha_altura','bainha/altura'],['cintura_bainha','cintura/bainha'],['camadas','camadas'],['L','L*'],['a','a*'],['b','b*']];
function gerarMedida(g,rnd){const w=+S.morfo.gen.pesoRede,nz=+S.morfo.gen.ruido,pr=PERFIL_REDE[g.rede]||PERFIL_REDE.R1,pz=PERFIL_ZONA[g.zona]||PERFIL_ZONA.campo;const o={grupo:g.grupo};

    const cv=(arr,k)=>{const x=arr.map(r=>r[k]),mu=x.reduce((a,b)=>a+b,0)/x.length;return Math.sqrt(x.reduce((a,b)=>a+(b-mu)**2,0)/(x.length-1))/mu*100};
    const cvP=cv(caps.filter(c=>c.t==='p'),'b'),cvM=cv(caps.filter(c=>c.t==='m'),'b');
    const dif=Math.abs(gA.bainha_altura-gB.bainha_altura)/((gA.bainha_altura+gB.bainha_altura)/2)*100;
    manHtml=`<div class="controlos">
     <label class="campo">Traje medido<select data-bind="manequim.gA">${m.linhas.map(r=>`<option ${r.grupo===mq.gA?'selected':''}>${r.grupo}</option>`).join('')}</select></label>
     <label class="campo">Comparar com<select data-bind="manequim.gB">${m.linhas.map(r=>`<option ${r.grupo===mq.gB?'selected':''}>${r.grupo}</option>`).join('')}</select></label>

     <div class="cartoes"><div class="cartao"><span>variação da bainha nas portadoras</span><strong>${f1(cvP)}%</strong></div><div class="cartao"><span>variação da bainha no manequim</span><strong>${f1(cvM)}%</strong></div><div class="cartao"><span>diferença ${esc(gA.grupo)} vs ${esc(gB.grupo)}</span><strong>${f1(dif)}%</strong></div></div>
     <div class="${cvP>dif?'alerta':'info'}">${cvP>dif?`Nas portadoras, a variação entre corpos (${f1(cvP)}%) é maior do que a diferença entre os dois grupos (${f1(dif)}%): estarias a medir corpos, não trajes.`:`Aqui a diferença entre grupos (${f1(dif)}%) supera a variação entre corpos (${f1(cvP)}%), mas o manequim continua a dar medidas ${cvM<cvP?'muito ':''}mais estáveis.`}</div>`}
  /* distâncias e testes */
  let resto='';
  if(linhas.length<3)resto=`<div class="alerta">Precisas de pelo menos 3 grupos com medidas na amostra.</div>`;

  else{
    const X=linhas.map(r=>vs.map(k=>+r[k]));const mu=vs.map((_,j)=>X.reduce((s,x)=>s+x[j],0)/X.length);const sd=vs.map((_,j)=>Math.sqrt(X.reduce((s,x)=>s+(x[j]-mu[j])**2,0)/(X.length-1))||1);
    const Z=X.map(x=>x.map((v,j)=>(v-mu[j])/sd[j]));const Dm=Z.map(a=>Z.map(b=>euclid(a,b)));
    const gs=linhas.map(r=>grupoPor(r.grupo));const Dg=gs.map(a=>gs.map(b=>Math.hypot(a.x-b.x,a.y-b.y)));const Dp=gs.map(a=>gs.map(b=>a.provincia===b.provincia?0:1));
    const R=calcularRede();const ids=linhas.map(r=>R.samp.indexOf(r.grupo));const Dn=ids.map(i=>ids.map(j=>R.Dfix[i][j]));
    const merges=hclust(Dm,m.metodo);const n=linhas.length;
    /* ordem das folhas */
    const kids={};merges.forEach(([a,b],i)=>kids[n+i]=[a,b]);const ordem=[];const rec=x=>{if(x<n)ordem.push(x);else{rec(kids[x][0]);rec(kids[x][1])}};rec(n+merges.length-1);

    const testes=[['morfologia ~ distância geográfica',Dm,Dg,null],['morfologia ~ distância na rede',Dm,Dn,null],['morfologia ~ província',Dm,Dp,null],['morfologia ~ geografia, controlando a rede',Dm,Dg,Dn],['morfologia ~ rede, controlando a geografia',Dm,Dn,Dg]].map(([nm,A,B,C])=>({nm,...mantel(A,B,C,{nperm:4999})}));
    const jk=n>=4?linhas.map((r,k)=>{const idx=linhas.map((_,i)=>i).filter(i=>i!==k);return{g:r.grupo,rr:pearson(upper(Dm,idx),upper(Dn,idx)),rg:pearson(upper(Dm,idx),upper(Dg,idx))}}):[];
    const rs=jk.map(x=>x.rr),rg=jk.map(x=>x.rg);

    <label class="campo">Cortar em: <span data-out="morfo.k">${m.k}</span><input type="range" min="1" max="${Math.min(6,n)}" step="1" data-bind="morfo.k" value="${Math.min(m.k,n)}"></label></div>
    ${dend}
    <p class="nota">Cor à direita: grupo morfológico no corte escolhido. Ao lado de cada nome: zona e comunidade na rede (secção 4). Se os grupos morfológicos coincidem com as comunidades e não com as zonas, a forma segue as pessoas.</p>
    <h3>Testar: Mantel</h3>
    ${R.desligada?`<div class="alerta">A rede da secção 4 está desligada: há grupos sem caminho entre si. A distância "infinita" foi substituída pela maior distância observada mais 1, uma convenção arbitrária. Liga os grupos (ou retira-os) na secção 4.</div>`:''}
    <div class="tabwrap"><table><tr><th>teste</th><th class="num">r</th><th class="num">p</th><th>permutações</th></tr>${testes.map(t=>`<tr><td>${t.nm}</td><td class="num ${t.p<.05?'forte':''}">${f2(t.r)}</td><td class="num">${t.p<.001?'<0,001':f3(t.p)}</td><td>${t.nperm.toLocaleString('pt-PT')} ${t.exact?'(todas as possíveis)':'(aleatórias)'}</td></tr>`).join('')}</table></div>
    <p class="nota">${n} grupos dão ${n*(n-1)/2} pares. Com poucos grupos o teste tem pouco poder: um r alto com p pequeno é encorajador, não prova.</p>
    ${jk.length?`<h4>Robustez: retirar um grupo de cada vez</h4><div class="tabwrap"><table><tr><th>sem o grupo</th><th class="num">r com a rede</th><th class="num">r com a geografia</th></tr>${jk.map(x=>`<tr><td>${esc(x.g)}</td><td class="num">${f2(x.rr)}</td><td class="num">${f2(x.rg)}</td></tr>`).join('')}</table></div><p class="nota">r com a rede entre ${f2(Math.min(...rs))} e ${f2(Math.max(...rs))}; com a geografia entre ${f2(Math.min(...rg))} e ${f2(Math.max(...rg))}. Se um único grupo muda a conclusão, a conclusão é frágil.</p>`:''}`}
  el.innerHTML=`<h2>Morfometria comparada</h2>
  <div class="prosa"><p>Primeiro, a razão para medir no manequim. Depois, as medidas de um traje de festa por grupo da amostra, o dendrograma e os testes de Mantel contra a geografia e contra a rede da secção 4.</p></div>

  <p class="nota">Saia/altura e bainha/altura: medidas divididas pela altura do manequim. L*: luminosidade (0 preto, 100 branco); a*: do verde ao vermelho; b*: do azul ao amarelo. A caixa em cada coluna decide se a medida entra na distância.</p>
  <details><summary>Gerar novas medidas para toda a amostra</summary>
   <p class="nota">As medidas inventadas misturam um perfil da rede oculta de cada grupo com um perfil da zona. Com o cursor todo à direita a forma segue a rede; todo à esquerda segue a geografia. Muda-o e vê o que acontece ao Mantel. Repara que, mesmo com a forma a seguir a zona, a correlação com a distância em quilómetros fica moderada: grupos da mesma zona podem estar a 90 km uns dos outros. Zona e distância não são a mesma coisa.</p>
   <div class="controlos"><label class="campo">A forma segue… geografia ↔ rede: <span data-out="morfo.gen.pesoRede" data-fmt="pct">${Math.round(m.gen.pesoRede*100)}%</span><input type="range" min="0" max="1" step="0.05" data-bind="morfo.gen.pesoRede" data-fmt="pct" value="${m.gen.pesoRede}"></label>
   <label class="campo">Ruído: <span data-out="morfo.gen.ruido">${m.gen.ruido}</span><input type="range" min="0" max="4" step="0.25" data-bind="morfo.gen.ruido" value="${m.gen.ruido}"></label>
   <label class="campo">Semente<input type="number" data-bind="morfo.gen.seed" value="${m.gen.seed}"></label></div>
   <button class="principal" id="gerarM">Gerar novas medidas</button> <button id="reporM">Repor as medidas originais</button>

  ${resto}`;
  ligar(el);
  el.querySelectorAll('[data-mvar]').forEach(c=>c.addEventListener('change',()=>{m.vars[c.dataset.mvar]=c.checked;refazer()}));
  const q=id=>el.querySelector('#'+id);

  q('gerarM')&&q('gerarM').addEventListener('click',()=>{const rnd=mulberry32(+m.gen.seed||1);const novas=samp.map(g=>gerarMedida(grupoPor(g),rnd));m.linhas=m.linhas.filter(r=>!samp.includes(r.grupo)).concat(novas);refazer()});
  q('reporM')&&q('reporM').addEventListener('click',()=>{m.linhas=estadoInicial().morfo.linhas;refazer()});

/* ================= 4. redes ================= */
function layoutRede(R){
  const nodes=R.nodes,pos={},rnd=mulberry32(7);const W=680,H=440;
  nodes.forEach((v,i)=>{if(S.rede.pos[v])pos[v]={...S.rede.pos[v]}});
  const livres=nodes.filter(v=>!pos[v]);
  const gs=R.samp;gs.forEach((g,i)=>{if(!pos[g]){const cm=Math.max(0,comunidadeDe(R,g));const ang=2*Math.PI*i/gs.length;pos[g]={x:W/2+Math.cos(ang)*170+(cm%2?60:-60),y:H/2+Math.sin(ang)*150}}});
  nodes.forEach(v=>{if(!pos[v]){const nb=R.adj[v];const mx=nb.length?nb.reduce((s,g)=>s+pos[g].x,0)/nb.length:W/2,my=nb.length?nb.reduce((s,g)=>s+pos[g].y,0)/nb.length:H/2;pos[v]={x:mx+(rnd()-.5)*40,y:my+(rnd()-.5)*40}}});
  if(livres.length){const k=62;for(let it=0;it<300;it++){const disp={};nodes.forEach(v=>disp[v]={x:0,y:0});
    for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=pos[nodes[i]],b=pos[nodes[j]];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||.01;const f=k*k/d;disp[nodes[i]].x+=dx/d*f;disp[nodes[i]].y+=dy/d*f;disp[nodes[j]].x-=dx/d*f;disp[nodes[j]].y-=dy/d*f}
    nodes.forEach(v=>R.adj[v].forEach(w=>{if(v<w){const a=pos[v],b=pos[w];let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||.01;const f=d*d/k;disp[v].x-=dx/d*f;disp[v].y-=dy/d*f;disp[w].x+=dx/d*f;disp[w].y+=dy/d*f}}));
    const t=20*(1-it/300)+1;livres.forEach(v=>{const d=disp[v],l=Math.hypot(d.x,d.y)||1;pos[v].x+=d.x/l*Math.min(l,t);pos[v].y+=d.y/l*Math.min(l,t);pos[v].x+=(W/2-pos[v].x)*0.01;pos[v].y+=(H/2-pos[v].y)*0.01})}}
  nodes.forEach(v=>{pos[v].x=Math.max(40,Math.min(W-40,pos[v].x));pos[v].y=Math.max(30,Math.min(H-30,pos[v].y))});
  return pos}
function render4(){
  const el=sec(4),rd=S.rede,R=calcularRede(),samp=R.samp;const pos=layoutRede(R);
  const tipos=Object.keys(rd.pesos);
  const corTipo=t=>t==='costureira'?'var(--garanca)':t==='consultor'?'var(--ocre)':'var(--pastel)';
  const topB=Object.entries(R.bc).sort((a,b)=>b[1]-a[1])[0];
  let svg=`<svg class="grafico" id="svgRede" style="touch-action:none" viewBox="0 0 680 440" role="img" aria-label="Rede entre pessoas e grupos">`;
  R.pessoas.forEach(p=>p.grupos.forEach(g=>{const a=pos['@'+p.nome],b=pos[g];const w=+(rd.pesos[p.tipo]??1);svg+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="stroke:${corTipo(p.tipo)};opacity:.75" stroke-width="${0.8+w*0.6}" ${p.tipo==='consultor'?'stroke-dasharray="6 4"':''}/>`}));
  samp.forEach(g=>{const p=pos[g],cm=comunidadeDe(R,g);svg+=`<g data-no="${esc(g)}" style="cursor:grab"><rect x="${p.x-24}" y="${p.y-14}" width="48" height="28" rx="4" style="fill:var(--surface2);stroke:${cm>=0?CORES[cm%CORES.length]:'var(--muted)'}" stroke-width="2.4"/><text x="${p.x}" y="${p.y+4.5}" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--ink)">${esc(g)}</text></g>`});
  R.pessoas.forEach(pp=>{const v='@'+pp.nome,p=pos[v];const destaque=topB&&topB[0]===v;svg+=`<g data-no="${esc(v)}" style="cursor:grab">${destaque?`<circle cx="${p.x}" cy="${p.y}" r="14" fill="none" style="stroke:var(--ink)" stroke-width="1" stroke-dasharray="3 2"/>`:''}<circle cx="${p.x}" cy="${p.y}" r="8" style="fill:${corTipo(pp.tipo)};stroke:var(--surface2)" stroke-width="2"/><text x="${p.x}" y="${p.y+22}" text-anchor="middle" font-size="11.5" style="fill:var(--muted)">${esc(pp.nome)}</text></g>`});
  svg+='</svg>';
  const rank=Object.entries(R.bc).map(([v,b])=>({v,b,g:R.adj[v].length})).sort((a,b)=>b.b-a.b||b.g-a.g);
  el.innerHTML=`<h2>Redes de circulação</h2>
  <div class="prosa"><p>Pessoas e grupos da amostra. Liga e desliga pessoas, muda os grupos a que cada uma está ligada, acrescenta quem quiseres. Arrasta os nós para arrumar o desenho. A rede alimenta o teste de Mantel da secção 2.</p><p>Experimenta desligar o ensaiador E3 e vê a rede partir-se.</p></div>
  ${R.desligada?`<div class="alerta">A rede está desligada: há grupos sem nenhum caminho entre si. Na secção 2, a distância entre eles passa a ser uma convenção arbitrária.</div>`:''}
  ${svg}
  <div class="cartoes" style="font-size:13px;color:var(--muted);gap:6px 18px"><span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6" style="fill:var(--garanca)"/></svg> costureira</span><span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6" style="fill:var(--ocre)"/></svg> consultor (tracejado)</span><span><svg width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="6" style="fill:var(--pastel)"/></svg> ensaiador, fundador, outro</span><span>contorno do grupo = comunidade · círculo tracejado = maior intermediação</span></div>
  <button class="pequeno" id="reLayout">Rearrumar o desenho</button>
  <div class="duas">
   <div><h3>Centralidade</h3><div class="tabwrap"><table><tr><th>nó</th><th class="num">grau</th><th class="num">intermediação</th></tr>${rank.map(r=>`<tr><td>${esc(r.v.replace(/^@/,''))}</td><td class="num">${r.g}</td><td class="num ${r===rank[0]?'forte':''}">${f3(r.b)}</td></tr>`).join('')}</table></div>
   <p class="nota">Grau: número de ligações. Intermediação: quantos caminhos mais curtos passam pelo nó. Quem tem mais ligações nem sempre é a ponte.</p></div>
   <div><h3>Comunidades (Louvain)</h3><div class="tabwrap"><table><tr><th>comunidade</th><th>grupos</th></tr>${R.comms.map((c,i)=>`<tr><td><span class="tag" style="background:${CORES[i%CORES.length]};color:var(--surface2)">${i+1}</span></td><td>${c.map(esc).join(', ')}</td></tr>`).join('')}</table></div>
   <h4>Pesos por tipo de ligação</h4><div class="controlos">${tipos.map(t=>`<label class="campo">${esc(t)}<input type="number" step="0.5" min="0" data-bind="rede.pesos.${t}" value="${rd.pesos[t]}"></label>`).join('')}</div>
   <p class="nota">O peso de uma ligação entre dois grupos é a soma dos pesos das pessoas que partilham. A distância na rede é o inverso do peso, somado ao longo do caminho mais curto.</p></div>
  </div>
  <h3>Pessoas</h3>
  <div class="tabwrap"><table><tr><th>ativa</th><th>nome</th><th>tipo</th><th>grupos a que está ligada</th><th></th></tr>
  ${rd.pessoas.map((p,i)=>`<tr><td><input type="checkbox" data-bind="rede.pessoas.${i}.ativo" ${p.ativo?'checked':''} aria-label="ativar ${esc(p.nome)}"></td><td><input type="text" data-bind="rede.pessoas.${i}.nome" value="${esc(p.nome)}"></td><td><select data-bind="rede.pessoas.${i}.tipo">${tipos.map(t=>`<option ${t===p.tipo?'selected':''}>${t}</option>`).join('')}</select></td><td><div class="lista-grupos">${samp.map(g=>`<label><input type="checkbox" data-pg="${i}|${esc(g)}" ${p.grupos.includes(g)?'checked':''}>${esc(g)}</label>`).join('')}</div></td><td><button class="pequeno" data-delp="${i}">apagar</button></td></tr>`).join('')}</table></div>
  <button class="pequeno" id="addP">Acrescentar pessoa</button>
  <details><summary>Distâncias na rede entre grupos</summary><div class="tabwrap"><table><tr><th></th>${samp.map(g=>`<th class="num">${esc(g)}</th>`).join('')}</tr>${samp.map((a,i)=>`<tr><th>${esc(a)}</th>${R.D[i].map(x=>`<td class="num">${isFinite(x)?f2(x):'∞'}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
  ligar(el,(inp)=>{if(inp.dataset.bind.endsWith('.nome')){S.rede.pos={}}refazer()});
  el.querySelectorAll('[data-pg]').forEach(c=>c.addEventListener('change',()=>{const[i,g]=c.dataset.pg.split('|');const p=rd.pessoas[+i];p.grupos=c.checked?[...new Set(p.grupos.concat(g))]:p.grupos.filter(x=>x!==g);refazer()}));
  el.querySelectorAll('[data-delp]').forEach(b=>b.addEventListener('click',()=>{rd.pessoas.splice(+b.dataset.delp,1);refazer()}));
  el.querySelector('#addP').addEventListener('click',()=>{rd.pessoas.push({nome:'Pessoa '+(rd.pessoas.length+1),tipo:'costureira',grupos:[],ativo:true});refazer()});
  el.querySelector('#reLayout').addEventListener('click',()=>{S.rede.pos={};refazer()});
  /* arrastar */
  const svgEl=el.querySelector('#svgRede');let alvo=null;
  const pt=e=>{const r=svgEl.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*680,y:(e.clientY-r.top)/r.height*440}};
  svgEl.querySelectorAll('[data-no]').forEach(g=>g.addEventListener('pointerdown',e=>{alvo=g.dataset.no;svgEl.setPointerCapture&&svgEl.setPointerCapture(e.pointerId);e.preventDefault()}));
  svgEl.addEventListener('pointermove',e=>{if(!alvo)return;const p=pt(e);Object.keys(pos).forEach(v=>S.rede.pos[v]=S.rede.pos[v]||{...pos[v]});S.rede.pos[alvo]={x:Math.max(30,Math.min(650,p.x)),y:Math.max(24,Math.min(416,p.y))};pos[alvo]=S.rede.pos[alvo];redesenharRede(svgEl,R,pos,corTipo,topB)});
  const fim=()=>{if(alvo){alvo=null;guardar()}};svgEl.addEventListener('pointerup',fim);svgEl.addEventListener('pointercancel',fim);
}
function redesenharRede(svgEl,R,pos,corTipo,topB){
  const lines=svgEl.querySelectorAll('line');let k=0;R.pessoas.forEach(p=>p.grupos.forEach(g=>{const a=pos['@'+p.nome],b=pos[g];const l=lines[k++];if(l){l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y)}}));
  svgEl.querySelectorAll('[data-no]').forEach(g=>{const p=pos[g.dataset.no];const r=g.querySelector('rect');if(r){r.setAttribute('x',p.x-24);r.setAttribute('y',p.y-14);const t=g.querySelector('text');t.setAttribute('x',p.x);t.setAttribute('y',p.y+4.5)}else{g.querySelectorAll('circle').forEach(c=>{c.setAttribute('cx',p.x);c.setAttribute('cy',p.y)});const t=g.querySelector('text');t.setAttribute('x',p.x);t.setAttribute('y',p.y+22)}})}

/* ================= 5. história oral ================= */
function render5(){
  const el=sec(5),o=S.oral,samp=amostra();
  const max=Math.max(1,...o.tabela.flatMap(r=>r.v.map(Number)));
  const heat=v=>`background:color-mix(in srgb, var(--anil) ${Math.round(+v/max*55)}%, transparent);`;
  el.innerHTML=`<h2>História oral como leitura próxima</h2>
  <div class="prosa"><p>Uma passagem codificada alimenta ao mesmo tempo a ficha, a rede e a interpretação das classes. Muda o excerto, os códigos e as ligações. A pessoa nova pode ir diretamente para a rede da secção 4.</p></div>
  <h3>Uma passagem</h3>
  <div class="painel"><div class="controlos"><label class="campo">Entrevista<input type="text" data-bind="oral.meta.id" value="${esc(o.meta.id)}" style="width:90px"></label><label class="campo">Perfil<input type="text" data-bind="oral.meta.perfil" value="${esc(o.meta.perfil)}" style="width:240px"></label></div>
  <label class="campo" style="margin-top:10px">Excerto<textarea class="excerto" data-bind="oral.excerto">${esc(o.excerto)}</textarea></label>
  <h4>Códigos aplicados</h4><div class="lista-grupos">${o.codigos.map((c,i)=>`<label><input type="checkbox" data-cod="${i}" ${o.aplicados.includes(c)?'checked':''}>${esc(c)}</label>`).join('')}</div>
  <div class="controlos" style="margin-top:8px"><label class="campo">Novo código<input type="text" id="novoCod" style="width:200px"></label><button class="pequeno" id="addCod">Acrescentar código</button></div>
  <h4>Ligações desta passagem</h4>
  <div class="controlos"><label class="campo">Peça (ficha)<input type="text" data-bind="oral.lig.peca" value="${esc(o.lig.peca)}" style="width:170px"></label><label class="campo">Evento<input type="text" data-bind="oral.lig.evento" value="${esc(o.lig.evento)}" style="width:190px"></label></div>
  <div class="controlos" style="margin-top:8px"><label class="campo">Pessoa nova<input type="text" data-bind="oral.lig.pessoa" value="${esc(o.lig.pessoa)}" style="width:170px"></label>
   <label class="campo">Tipo<select data-bind="oral.lig.tipo">${Object.keys(S.rede.pesos).map(t=>`<option ${t===o.lig.tipo?'selected':''}>${t}</option>`).join('')}</select></label>
   <label class="campo">Grupo<select data-bind="oral.lig.grupo">${samp.map(g=>`<option ${g===o.lig.grupo?'selected':''}>${esc(g)}</option>`).join('')}</select></label>
   <button class="pequeno" id="paraRede">Acrescentar à rede</button></div>
  <p class="nota" id="msgRede"></p></div>
  <h3>Códigos por classe</h3>
  <p class="nota">Percentagem das passagens ligadas a trajes de cada classe que têm o código. Uma passagem pode ter vários códigos, por isso as colunas não somam 100.</p>
  <div class="tabwrap"><table><tr><th>código</th>${o.classes.map((c,j)=>`<th class="num"><input type="text" data-bind="oral.classes.${j}" value="${esc(c)}" style="width:110px;text-align:right" aria-label="nome da classe ${j+1}"></th>`).join('')}<th></th></tr>
  ${o.tabela.map((r,i)=>`<tr><td><input type="text" data-bind="oral.tabela.${i}.cod" value="${esc(r.cod)}"></td>${r.v.map((v,j)=>`<td class="num" style="${heat(v)}"><input type="number" min="0" max="100" data-bind="oral.tabela.${i}.v.${j}" value="${v}"></td>`).join('')}<td><button class="pequeno" data-delt="${i}">apagar</button></td></tr>`).join('')}</table></div>
  <button class="pequeno" id="addLinha">Acrescentar código à tabela</button>
  ${(()=>{const js=o.classes.map((_,j)=>j);const lead=o.tabela.map(r=>{const v=r.v.map(Number);const mx=Math.max(...v);return{c:r.cod,j:v.indexOf(mx),mx}});return`<div class="info">${lead.map(l=>`${esc(l.c)}: mais forte em <strong>${esc(o.classes[l.j])}</strong> (${l.mx}%)`).join('<br>')}</div>`})()}
  <h3>A tua leitura</h3>
  <textarea data-bind="oral.nota" placeholder="Ex.: a classe 'mercado' tem tanto orgulho local como as outras; os sintéticos explicam-se pela lavagem depois de cada festival. Mudar o nome para 'pragmático'?">${esc(o.nota)}</textarea>`;
  ligar(el);
  el.querySelectorAll('[data-cod]').forEach(c=>c.addEventListener('change',()=>{const nm=o.codigos[+c.dataset.cod];o.aplicados=c.checked?[...new Set(o.aplicados.concat(nm))]:o.aplicados.filter(x=>x!==nm);guardar()}));
  el.querySelector('#addCod').addEventListener('click',()=>{const v=el.querySelector('#novoCod').value.trim();if(v&&!o.codigos.includes(v)){o.codigos.push(v);refazer()}});
  el.querySelector('#addLinha').addEventListener('click',()=>{o.tabela.push({cod:'novo código',v:o.classes.map(()=>0)});refazer()});
  el.querySelectorAll('[data-delt]').forEach(b=>b.addEventListener('click',()=>{o.tabela.splice(+b.dataset.delt,1);refazer()}));
  el.querySelector('#paraRede').addEventListener('click',()=>{const nm=o.lig.pessoa.trim();const msg=el.querySelector('#msgRede');if(!nm){msg.textContent='Escreve o nome da pessoa primeiro.';return}
    let p=S.rede.pessoas.find(x=>x.nome===nm);if(p){p.grupos=[...new Set(p.grupos.concat(o.lig.grupo))];p.ativo=true}else S.rede.pessoas.push({nome:nm,tipo:o.lig.tipo,grupos:[o.lig.grupo],ativo:true});
    guardar();msg.textContent=`${nm} está agora na rede, ligada a ${o.lig.grupo}. Vê a secção 4.`});
}

/* ================= 6. PREC ================= */
function render6(){
  const el=sec(6),p=S.prec;
  const series=p.familias.map((f,k)=>({nome:f,valores:p.anos.map(a=>p.modo==='pct'?+a.v[k]:Math.round(+a.v[k]*(+a.artigos)/100))}));
  el.innerHTML=`<h2>O capítulo do PREC</h2>
  <div class="prosa"><p>Artigos que mencionam folclore ou ranchos, ano a ano, e a percentagem em que cada família de termos aparece junto de "folclore". Edita os números, acrescenta anos e famílias de termos.</p></div>
  <div class="controlos"><label class="campo">Mostrar<select data-bind="prec.modo"><option value="pct" ${p.modo==='pct'?'selected':''}>percentagem dos artigos do ano</option><option value="abs" ${p.modo==='abs'?'selected':''}>número estimado de artigos</option></select></label></div>
  ${graficoLinhas({rotulos:p.anos.map(a=>String(a.ano)),series,yTitulo:p.modo==='pct'?'% dos artigos do ano':'número de artigos (estimado)',yMin:0,aria:'Termos associados a folclore por ano'})}
  ${p.modo==='abs'?`<div class="alerta">Em números absolutos, os anos com mais artigos parecem sempre mais "intensos". 1974 tem muito menos artigos do que 1978: compara em percentagem.</div>`:''}
  <div class="tabwrap"><table><tr><th>ano</th><th class="num">artigos</th>${p.familias.map((f,k)=>`<th><input type="text" data-bind="prec.familias.${k}" value="${esc(f)}" style="min-width:150px" aria-label="família ${k+1}"> <button class="pequeno" data-delf="${k}" aria-label="apagar família">×</button></th>`).join('')}<th></th></tr>
  ${p.anos.map((a,i)=>`<tr><td><input type="number" data-bind="prec.anos.${i}.ano" value="${a.ano}"></td><td class="num"><input type="number" min="0" data-bind="prec.anos.${i}.artigos" value="${a.artigos}"></td>${a.v.map((v,k)=>`<td class="num"><input type="number" min="0" max="100" data-bind="prec.anos.${i}.v.${k}" value="${v}"> %</td>`).join('')}<td><button class="pequeno" data-dela="${i}">apagar</button></td></tr>`).join('')}</table></div>
  <button class="pequeno" id="addAno">Acrescentar ano</button> <button class="pequeno" id="addFam">Acrescentar família de termos</button>
  <p class="nota">Total de artigos no corpus: ${p.anos.reduce((s,a)=>s+(+a.artigos||0),0)}.</p>
  <h3>Palavras mais próximas de "folclore"</h3>
  <div class="duas">${p.coloc.map((c,i)=>`<div class="painel"><label class="campo">Ano<input type="text" data-bind="prec.coloc.${i}.ano" value="${esc(c.ano)}" style="width:80px"></label><label class="campo" style="margin-top:8px">Colocações, separadas por vírgulas<textarea data-bind="prec.coloc.${i}.termos">${esc(c.termos)}</textarea></label><div class="cartoes">${c.termos.split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag t-litoral">${esc(t)}</span>`).join('')}</div></div>`).join('')}</div>
  <h3>Antes de escrever a hipótese</h3>
  ${p.checks.map((c,i)=>`<label style="display:flex;gap:8px;align-items:flex-start;margin:6px 0"><input type="checkbox" data-bind="prec.checks.${i}.ok" ${c.ok?'checked':''}> <span>${esc(c.t)}</span></label>`).join('')}
  ${p.checks.every(c=>c.ok)?`<div class="info">As três verificações estão feitas. A hipótese pode ir para o texto, com as suas limitações ditas.</div>`:`<div class="alerta">Faltam ${p.checks.filter(c=>!c.ok).length} verificações. Até lá, a curva é um mapa, não uma conclusão.</div>`}`;
  ligar(el);
  el.querySelectorAll('[data-dela]').forEach(b=>b.addEventListener('click',()=>{p.anos.splice(+b.dataset.dela,1);refazer()}));
  el.querySelectorAll('[data-delf]').forEach(b=>b.addEventListener('click',()=>{const k=+b.dataset.delf;if(p.familias.length<=1)return;p.familias.splice(k,1);p.anos.forEach(a=>a.v.splice(k,1));refazer()}));
  el.querySelector('#addAno').addEventListener('click',()=>{const u=p.anos[p.anos.length-1];p.anos.push({ano:u?+u.ano+1:1979,artigos:0,v:p.familias.map(()=>0)});refazer()});
  el.querySelector('#addFam').addEventListener('click',()=>{if(p.familias.length>=6)return;p.familias.push('nova família');p.anos.forEach(a=>a.v.push(0));refazer()});
}

/* ================= exportar / importar ================= */
let DL=null;
function abrirModal(html){const m=document.getElementById('modal');document.getElementById('modalCaixa').innerHTML=html;m.classList.add('aberto');const f=m.querySelector('button,textarea,select,input');f&&f.focus()}
function fecharModal(){document.getElementById('modal').classList.remove('aberto')}
async function guardarFicheiro(nome,conteudo){
  if(DL){try{await DL.save({filename:nome,data:conteudo});return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){alert('Já há um pedido de gravação aberto. Tenta de novo daqui a pouco.');return}}}
  if(!(window.claude&&window.claude.use)){try{const csv=/\.csv$/i.test(nome);const b=new Blob([(csv?'\ufeff':'')+conteudo],{type:csv?'text/csv;charset=utf-8':'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download=nome;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return}catch(e){}}
  abrirModal(`<h3 id="modalTitulo" style="margin-top:0">${esc(nome)}</h3><p class="nota">Não foi possível gravar o ficheiro diretamente aqui. Copia o conteúdo e cola-o num ficheiro de texto.</p><textarea id="conteudo" style="min-height:260px;font-family:monospace;font-size:12.5px">${esc(conteudo)}</textarea><div class="acoes" style="margin-top:10px"><button id="copiar" class="principal">Copiar</button><button id="fechar">Fechar</button></div>`);
  document.getElementById('copiar').onclick=async()=>{const t=document.getElementById('conteudo');t.select();try{await navigator.clipboard.writeText(t.value)}catch(e){try{document.execCommand('copy')}catch(_){}}};
  document.getElementById('fechar').onclick=fecharModal}
function exportar(){
  abrirModal(`<h3 id="modalTitulo" style="margin-top:0">Exportar</h3><p class="nota">O estado completo guarda tudo o que mudaste e pode ser importado mais tarde. Os CSV abrem no Excel, no R ou no Python.</p>
  <div class="acoes"><button data-x="json" class="principal">Estado completo (JSON)</button><button data-x="trajes">Trajes (CSV)</button><button data-x="grupos">Grupos (CSV)</button><button data-x="morfo">Medidas (CSV)</button><button data-x="acm">Resultados da ACM (CSV)</button></div><div class="acoes" style="margin-top:14px"><button id="fechar">Fechar</button></div>`);
  document.getElementById('fechar').onclick=fecharModal;
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const x=b.dataset.x;fecharModal();
    if(x==='json')guardarFicheiro('laboratorio-traje.json',JSON.stringify(S,null,1));
    if(x==='trajes')guardarFicheiro('trajes.csv',toCSV(S.trajes));
    if(x==='grupos')guardarFicheiro('grupos.csv',toCSV(S.grupos));
    if(x==='morfo')guardarFicheiro('medidas.csv',toCSV(S.morfo.linhas));
    if(x==='acm'){const R=calcularACM();if(R.erro){alert(R.erro);return}const rows=R.M.cats.map((c,j)=>({tipo:'ativa',variavel:c.v,categoria:c.l,coord1:R.M.G[j][0]?.toFixed(4),coord2:R.M.G[j][1]?.toFixed(4),contrib1:R.M.ctr[j][0]?.toFixed(2),contrib2:R.M.ctr[j][1]?.toFixed(2)})).concat(R.M.sup.map(s=>({tipo:'suplementar',variavel:s.v,categoria:s.l,coord1:s.coord[0]?.toFixed(4),coord2:s.coord[1]?.toFixed(4),contrib1:'',contrib2:'',vteste1:s.vtest[0]?.toFixed(2),vteste2:s.vtest[1]?.toFixed(2)})));guardarFicheiro('acm.csv',toCSV(rows,['tipo','variavel','categoria','coord1','coord2','contrib1','contrib2','vteste1','vteste2']))}})}
function importar(){
  abrirModal(`<h3 id="modalTitulo" style="margin-top:0">Importar</h3>
  <div class="controlos"><label class="campo">O que estás a importar<select id="alvo"><option value="json">estado completo (JSON exportado daqui)</option><option value="trajes">trajes (CSV: uma linha por traje)</option><option value="grupos">grupos (CSV)</option><option value="morfo">medidas (CSV)</option></select></label><label class="campo">Ficheiro<input type="file" id="fich" accept=".csv,.json,.txt"></label></div>
  <label class="campo" style="margin-top:10px">Ou cola aqui o conteúdo<textarea id="txt" style="min-height:180px;font-family:monospace;font-size:12.5px"></textarea></label>
  <p class="nota">Trajes: precisa das colunas <code>grupo</code> e <code>traje</code>; todas as outras colunas aparecem na ACM como variáveis categóricas. Grupos: <code>grupo, zona, fundacao, arquivo, x, y, provincia, rede</code>. Medidas: <code>grupo, saia_altura, bainha_altura, cintura_bainha, camadas, L, a, b</code>.</p>
  <p class="nota" id="erroImp" style="color:var(--garanca)"></p>
  <div class="acoes"><button id="carregar" class="principal">Carregar</button><button id="fechar">Cancelar</button></div>`);
  document.getElementById('fechar').onclick=fecharModal;
  document.getElementById('fich').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{document.getElementById('txt').value=r.result;if(/\.json$/i.test(f.name))document.getElementById('alvo').value='json'};r.readAsText(f)};
  document.getElementById('carregar').onclick=()=>{const alvo=document.getElementById('alvo').value,txt=document.getElementById('txt').value.trim(),err=document.getElementById('erroImp');
    if(!txt){err.textContent='Não há nada para carregar: escolhe um ficheiro ou cola o conteúdo.';return}
    try{
      if(alvo==='json'){const o=JSON.parse(txt.replace(/^\ufeff/,''));if(!o||o.versao!==1||!o.grupos||!o.trajes)throw new Error('Este JSON não é um estado exportado deste laboratório.');S=o}
      else{const rows=parseCSV(txt);if(!rows.length)throw new Error('O CSV não tem linhas de dados.');
        if(alvo==='trajes'){if(!('grupo'in rows[0])||!('traje'in rows[0]))throw new Error('Faltam as colunas "grupo" e "traje".');S.trajes=rows;Object.keys(rows[0]).forEach(c=>{if(c!=='grupo'&&c!=='traje'&&!S.papeis[c])S.papeis[c]='ativa'});
          rows.forEach(r=>{if(!grupoPor(r.grupo))S.grupos.push({grupo:r.grupo,zona:'campo',fundacao:1980,periodo:'1974-89',entrada_ffp:'',arquivo:'parcial',x:30,y:45,provincia:'Estremadura',rede:'R1',amostra:false})})}
        if(alvo==='grupos'){if(!('grupo'in rows[0]))throw new Error('Falta a coluna "grupo".');S.grupos=rows.map(r=>({grupo:r.grupo,zona:r.zona||'campo',fundacao:+r.fundacao||1980,periodo:periodoDe(+r.fundacao||1980),entrada_ffp:r.entrada_ffp||'',arquivo:r.arquivo||'parcial',x:+r.x||0,y:+r.y||0,provincia:r.provincia||'Estremadura',rede:r.rede||'R1',amostra:String(r.amostra).toLowerCase()==='true'}));sincronizarTrajes()}
        if(alvo==='morfo'){if(!('grupo'in rows[0]))throw new Error('Falta a coluna "grupo".');S.morfo.linhas=rows.map(r=>({grupo:r.grupo,saia_altura:+r.saia_altura,bainha_altura:+r.bainha_altura,cintura_bainha:+r.cintura_bainha,camadas:+r.camadas,L:+r.L,a:+r.a,b:+(r.b??r.b_)}))}}
      fecharModal();guardar();montarNav();irPara(S.tab||0)}
    catch(e){err.textContent=e.message||'Não foi possível ler o conteúdo.'}}}

/* ================= arranque ================= */
S=carregar();
montarNav();irPara(S.tab||0);
document.getElementById('bExportar').onclick=exportar;
document.getElementById('bImportar').onclick=importar;
document.getElementById('bRepor').onclick=()=>{abrirModal(`<h3 id="modalTitulo" style="margin-top:0">Repor os dados originais?</h3><p>Perdes todas as alterações feitas neste navegador. Se quiseres guardá-las, exporta primeiro o estado completo.</p><div class="acoes"><button id="sim" class="principal">Repor</button><button id="nao">Cancelar</button></div>`);
  document.getElementById('sim').onclick=()=>{S=estadoInicial();guardar();fecharModal();montarNav();irPara(0)};
  document.getElementById('nao').onclick=fecharModal};
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')fecharModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharModal()});
(async()=>{try{if(window.claude&&window.claude.use){DL=await window.claude.use('downloads')}}catch(e){DL=null}})();

</script>
